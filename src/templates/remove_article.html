{% extends "layout.html" %}

{% block title %}
Remove an article citation
{% endblock %}

{% block body %}
<h1>Remove an article citation</h1>

  <form action="/remove_article/{{ article.id }}" method="post">
    <p>
      Do you want to remove article citation?
    </p>
    {% if next_page %}
    <input type="hidden" name="next_page" value="{{ next_page }}" />
    {% else %}
    <input type="hidden" name="next_page" value="/" />
    {% endif %}
    <input type="submit" name="continue" value="Continue" />
    <input type="submit" name="cancel" value="Cancel" />
  </form>
{% endblock %}
