{% extends "layout.html" %}

{% block title %}
Edit a book citation
{% endblock %}

{% block body %}

<h2>Edit a citation</h2>

<form action="/edit_book/{{ book.id }}" method="post">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <div>
    <label for="key">Key:</label>
    <input type="text" name="key" value="{{ book.key}}" required>
  </div>
  <div>
    <label for="author">Author:</label>
    <input type="text" name="author" value="{{ book.author }}" required>
  </div>
  <div>
    <label for="title">Title:</label>
    <input type="text" name="title" value="{{ book.title }}" required>
  </div>
  <div>
    <label for="year">Year:</label>
    <input type="text" name="year" value="{{ book.year }}" required>
  </div>
  <div>
    <label for="publisher">Publisher:</label>
    <input type="text" name="publisher" value="{{ book.publisher }}" required>
  </div>
  <div>
    <label for="address">Address:</label>
    <input type="text" name="address" value="{{ book.address }}">
  </div>
  <br>
  <button type="submit">
    Save
  </button>
</form>

{% endblock %}
